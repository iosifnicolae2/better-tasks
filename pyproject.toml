[project]
name = "supermanager"
version = "0.1.0"
description = "A manager Claude that plans a backlog and dispatches isolated Claude Code agents per task."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "mcp>=1.2",
    "typer>=0.12",
    "rich>=13",
    "tomli-w>=1.0",
]

[project.scripts]
supermanager = "supermanager.cli:main"
sm = "supermanager.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supermanager"]
